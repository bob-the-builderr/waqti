<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Basheer R1</title>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@800;900&family=Noto+Kufi+Arabic:wght@900&family=Kufam:wght@800&family=Baloo+Bhaijaan+2:wght@800&family=Sora:wght@800&family=Outfit:wght@800&family=Fraunces:opsz,wght@72,800&family=Lexend:wght@800&display=block" rel="stylesheet">
<style>
body{margin:0;padding:24px;background:#F4F2EE;font-family:Arial;color:#2A140C}
h2{font:700 14px Arial;margin:18px 0 8px;color:#666;text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap}
.t{text-align:center;font:11px Arial;color:#777;width:150px}
svg.i{width:150px;height:150px;display:block;margin-bottom:6px}
svg.s{width:48px;height:48px}
.wm{font-size:64px;line-height:1.3;padding:4px 18px;background:#fff;border-radius:12px}
</style></head><body>
<h2>Basheer — round 1 symbols</h2>
<div class="row" id="icons"></div>
<h2>48px on candidate backgrounds</h2>
<div id="small"></div>
<h2>Arabic wordmark starting points</h2>
<div class="row">
 <div class="wm" style="font-family:'Noto Kufi Arabic';font-weight:900">بشير</div>
 <div class="wm" style="font-family:Alexandria;font-weight:900">بشير</div>
 <div class="wm" style="font-family:Kufam;font-weight:800">بشير</div>
 <div class="wm" style="font-family:'Baloo Bhaijaan 2';font-weight:800">بشير</div>
</div>
<h2>Latin pairing</h2>
<div class="row">
 <div class="wm" style="font-family:Sora;font-weight:800;font-size:54px">Basheer</div>
 <div class="wm" style="font-family:Outfit;font-weight:800;font-size:58px">basheer</div>
 <div class="wm" style="font-family:Fraunces;font-weight:800;font-size:56px">Basheer</div>
 <div class="wm" style="font-family:Lexend;font-weight:800;font-size:52px">BASHEER</div>
</div>
<script>
const W='#fff', A='#FFD27A';
const icons={
 "A the sheen: 3 teeth + 3 dots":`<g fill="none" stroke="${W}" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"><path d="M156,96V118Q156,132 142,132H138Q126,132 126,118V104M126,118Q126,132 112,132H108Q96,132 96,118V104M96,118Q96,132 82,132Q46,132 46,104"/></g><g fill="${W}"><circle cx="111" cy="54" r="12"/><circle cx="94" cy="80" r="12"/><circle cx="128" cy="80" r="12"/></g>`,
 "B three dots over one stroke":`<g fill="${W}"><circle cx="100" cy="58" r="17"/><circle cx="72" cy="94" r="17"/><circle cx="128" cy="94" r="17"/></g><path d="M44,128Q100,170 156,128" fill="none" stroke="${W}" stroke-width="24" stroke-linecap="round"/>`,
 "C baa = tray + dot":`<path d="M40,92V112Q40,132 60,132H140Q160,132 160,112V92" fill="none" stroke="${W}" stroke-width="26" stroke-linecap="round"/><circle cx="100" cy="164" r="16" fill="${A}"/><circle cx="100" cy="88" r="20" fill="${W}"/>`,
 "D word in icon":`<text x="100" y="128" text-anchor="middle" font-family="Noto Kufi Arabic" font-weight="900" font-size="68" fill="${W}">بشير</text>`,
 "E sheen dots as shops, accent home":`<g fill="${W}"><circle cx="100" cy="52" r="15"/><circle cx="74" cy="86" r="15"/><circle cx="126" cy="86" r="15"/></g><path d="M74,86L100,52L126,86" fill="none" stroke="${W}" stroke-width="8"/><path d="M100,104V140" stroke="${W}" stroke-width="8"/><circle cx="100" cy="152" r="17" fill="${A}"/>`,
 "F naskh sheen glyph":`<text x="100" y="140" text-anchor="middle" font-family="Alexandria" font-weight="900" font-size="130" fill="${W}">ش</text>`
};
const bgs=['#C2461E','#0E5A4F','#1B1A55'];
const box=(inner,bg,cls)=>`<svg class="${cls}" viewBox="0 0 200 200"><rect width="200" height="200" rx="46" fill="${bg}"/>${inner}</svg>`;
document.getElementById('icons').innerHTML=Object.entries(icons).map(([k,v])=>`<div class="t">${box(v,bgs[0],'i')}${k}</div>`).join('');
document.getElementById('small').innerHTML=bgs.map(bg=>`<div class="row" style="margin-bottom:10px">${Object.values(icons).map(v=>box(v,bg,'s')).join('')}<span class="t" style="width:auto">${bg}</span></div>`).join('');
</script></body></html>
