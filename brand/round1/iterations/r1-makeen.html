<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Makeen R1</title>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@800;900&family=Noto+Kufi+Arabic:wght@800;900&family=Kufam:wght@800&family=Readex+Pro:wght@700&family=Sora:wght@800&family=Unbounded:wght@800&family=Outfit:wght@800&family=Syne:wght@800&display=block" rel="stylesheet">
<style>
body{margin:0;padding:24px;background:#F4F2EE;font-family:Sora,Arial;color:#15123D}
h2{font:700 14px Arial;margin:18px 0 8px;color:#666;text-transform:uppercase;letter-spacing:.08em}
.row{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap}
.t{text-align:center;font:11px Arial;color:#777}
svg.i{width:150px;height:150px;display:block;margin-bottom:6px}
svg.s{width:48px;height:48px}
.wm{font-size:64px;line-height:1.3;padding:4px 18px;background:#fff;border-radius:12px}
</style></head><body>
<h2>Makeen — round 1 symbols (indigo #3A2BEF)</h2>
<div class="row" id="icons"></div>
<h2>Same at 48px, on three candidate backgrounds</h2>
<div id="small"></div>
<h2>Arabic wordmark starting points</h2>
<div class="row">
 <div class="wm" style="font-family:'Noto Kufi Arabic';font-weight:900">مكين</div>
 <div class="wm" style="font-family:Alexandria;font-weight:900">مكين</div>
 <div class="wm" style="font-family:Kufam;font-weight:800">مكين</div>
 <div class="wm" style="font-family:'Readex Pro';font-weight:700">مكين</div>
</div>
<h2>Latin pairing</h2>
<div class="row">
 <div class="wm" style="font-family:Sora;font-weight:800;font-size:54px">Makeen</div>
 <div class="wm" style="font-family:Unbounded;font-weight:800;font-size:48px">MAKEEN</div>
 <div class="wm" style="font-family:Outfit;font-weight:800;font-size:58px">makeen</div>
 <div class="wm" style="font-family:Syne;font-weight:800;font-size:56px">MAKEEN</div>
</div>
<script>
const W='#fff';
const icons={
 "A kufic-meem pin":`<path fill-rule="evenodd" fill="${W}" d="M60,36H140Q146,36 146,42V118Q146,124 140,124H122L100,162L78,124H60Q54,124 54,118V42Q54,36 60,36ZM82,62V98H118V62Z"/>`,
 "B meem pin, off-centre counter + tail":`<path fill-rule="evenodd" fill="${W}" d="M70,40H146V122H116L96,158L88,122H34V98H70ZM94,62V98H124V62Z"/>`,
 "C meem+kaf monogram":`<g fill="${W}"><rect x="36" y="128" width="128" height="22" rx="3"/><rect x="66" y="38" width="22" height="112" rx="3"/><rect x="36" y="38" width="52" height="22" rx="3"/><path fill-rule="evenodd" d="M110,84H164V150H110ZM128,102V128H146V102Z"/></g>`,
 "D word in icon":`<text x="100" y="128" text-anchor="middle" font-family="Noto Kufi Arabic" font-weight="900" font-size="74" fill="${W}">مكين</text>`,
 "E naskh meem":`<text x="100" y="150" text-anchor="middle" font-family="Alexandria" font-weight="900" font-size="150" fill="${W}">م</text>`,
 "F three blocks, one route":`<g fill="${W}"><rect x="40" y="40" width="54" height="54" rx="10"/><rect x="106" y="40" width="54" height="54" rx="10"/><rect x="40" y="106" width="54" height="54" rx="10"/><circle cx="133" cy="133" r="22"/></g>`
};
const bgs=['#3A2BEF','#15123D','#2341FF'];
const box=(inner,bg,cls)=>`<svg class="${cls}" viewBox="0 0 200 200"><rect width="200" height="200" rx="46" fill="${bg}"/>${inner}</svg>`;
document.getElementById('icons').innerHTML=Object.entries(icons).map(([k,v])=>`<div class="t">${box(v,bgs[0],'i')}${k}</div>`).join('');
document.getElementById('small').innerHTML=bgs.map(bg=>`<div class="row" style="margin-bottom:10px">${Object.values(icons).map(v=>box(v,bg,'s')).join('')}<span class="t">${bg}</span></div>`).join('');
</script></body></html>
